<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A4B9B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mis cartas">
<link rel="manifest" href="manifest.json">
<title>Mi colección Pokémon TCG</title>
<style>
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --surface-2:#F5F7FA; --ink:#1C2333; --ink-2:#465066; --ink-3:#717B8F;
  --line:#D5DBE5; --sleeve:#A6AFC0; --yellow:#F5C518; --yellow-deep:#C99A00; --face:#FFFDF3;
  --blue:#2A4B9B; --on-blue:#FFFFFF; --blue-soft:#E2E8F6; --blue-text:#2A4B9B; --warn-soft:#F4ECE0; --warn-text:#7A4E12;
  --scrim:rgba(16,20,28,.48);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10141C; --surface:#171D28; --surface-2:#1D2431; --ink:#E8EBF2; --ink-2:#B4BCCC; --ink-3:#8A93A6;
    --line:#2A3243; --sleeve:#4A5469; --yellow:#E9B90E; --yellow-deep:#E9B90E; --face:#232A38;
    --blue:#86A2EE; --on-blue:#0E1424; --blue-soft:#1E2944; --blue-text:#9DB4F2; --warn-soft:#2E2618; --warn-text:#E3BE7E;
    --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10141C; --surface:#171D28; --surface-2:#1D2431; --ink:#E8EBF2; --ink-2:#B4BCCC; --ink-3:#8A93A6;
  --line:#2A3243; --sleeve:#4A5469; --yellow:#E9B90E; --yellow-deep:#E9B90E; --face:#232A38;
  --blue:#86A2EE; --on-blue:#0E1424; --blue-soft:#1E2944; --blue-text:#9DB4F2; --warn-soft:#2E2618; --warn-text:#E3BE7E;
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans JP",sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}

/* encabezado */
.top{padding:18px 0 10px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-size:15px;font-weight:600;margin:0;color:var(--ink-2);letter-spacing:.01em}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:36px;padding:0 14px;font-size:14px;color:var(--ink-2)}
.total{display:flex;align-items:baseline;gap:8px;margin:10px 0 8px}
.total b{font-size:40px;line-height:1;font-weight:750;letter-spacing:-.02em}
.total span{color:var(--ink-2);font-size:15px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--yellow);border-radius:99px;transition:width .4s ease}
.sub{display:flex;gap:18px;margin-top:10px;font-size:14px;color:var(--ink-2);flex-wrap:wrap}
.sub strong{color:var(--ink);font-weight:650}

/* barra fija de filtros */
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;white-space:nowrap;color:var(--ink-2)}
.chip small{font-size:12px;color:var(--ink-3);margin-left:4px}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.chip[aria-pressed="true"] small{color:var(--on-blue);opacity:.85}
.tools{display:flex;gap:8px;margin-top:10px}
.tools input{flex:1;min-width:0}
input[type="search"],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:42px;padding:0 12px;font-size:16px}
select{padding-right:8px;max-width:46%}
textarea{height:auto;min-height:96px;padding:10px 12px;width:100%;font-size:13px;line-height:1.4;resize:vertical}

.region-line{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 10px}
.region-line h2{font-size:22px;margin:0;font-weight:700}
.region-line span{font-size:14px;color:var(--ink-2)}

/* carpeta de 3 bolsillos */
.binder{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;padding-bottom:12px}
.tile{position:relative;min-height:86px}
.tbtn{position:absolute;inset:0;width:100%;border-radius:8px;text-align:left;padding:8px 9px 8px;display:flex;flex-direction:column;justify-content:space-between;border:1.5px dashed var(--sleeve);background:transparent;color:var(--ink-3)}
.tbtn .no{font-size:12px;font-weight:600;letter-spacing:.02em}
.tbtn .nm{display:block;font-size:13px;font-weight:650;line-height:1.2;overflow-wrap:break-word;letter-spacing:-.005em}
.tbtn .nc{display:block;font-size:11.5px;font-weight:500;color:var(--warn-text);margin-top:2px}
.tile.has .tbtn{border:4px solid var(--yellow);background:var(--face);color:var(--ink);padding:6px 5px 6px 6px}
.tile.has .tbtn .no{color:var(--ink-2)}
.info{position:absolute;top:2px;right:2px;width:32px;height:32px;border:0;background:transparent;border-radius:8px;display:grid;place-items:center;color:var(--ink-3)}
.tile.has .info{color:var(--ink-2)}
.info svg{width:17px;height:17px}
.tile.pop .tbtn{animation:pop .28s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(.94)}100%{transform:scale(1)}}

/* listas */
.list{list-style:none;margin:0;padding:0 0 12px}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.row-main{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:12px 4px 12px 14px;border-radius:12px}
.row-title{font-weight:650;font-size:16px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.row-title .no{font-size:13px;color:var(--ink-3);font-weight:500}
.row-meta{font-size:13.5px;color:var(--ink-2);margin-top:2px}
.row-meta em{font-style:normal;color:var(--ink)}
.mark{flex:none;margin-right:10px;width:40px;height:40px;border-radius:10px;border:1.5px dashed var(--sleeve);background:transparent;display:grid;place-items:center;color:var(--ink-3)}
.mark svg{width:18px;height:18px}
.mark[aria-pressed="true"]{border:3px solid var(--yellow);background:var(--face);color:var(--ink)}
.count{flex:none;text-align:right;padding-right:14px;min-width:64px}
.count b{display:block;font-size:24px;line-height:1.1;font-weight:750}
.count span{font-size:12px;color:var(--ink-3)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--blue-soft);color:var(--blue-text)}
.tag.none{background:var(--warn-soft);color:var(--warn-text)}
.seg{display:inline-flex;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 16px;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--on-blue)}
.hint{font-size:14px;color:var(--ink-2);margin:12px 0}
.empty{padding:32px 8px;text-align:center;color:var(--ink-2)}
.more{display:block;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;font-size:15px;color:var(--blue-text);margin:4px 0 16px}

/* navegación inferior */
main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{border:0;background:transparent;padding:10px 4px 12px;font-size:13px;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--blue-text);font-weight:650}

/* hoja inferior */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
.sheet[hidden]{display:none}
.panel{background:var(--surface);width:100%;max-width:640px;max-height:88vh;max-height:88dvh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.panel-head{display:flex;align-items:flex-start;gap:8px;padding:14px 14px 10px 18px;border-bottom:1px solid var(--line)}
.panel-head .titles{flex:1;min-width:0}
.panel-head h3{margin:0;font-size:22px;line-height:1.2;font-weight:750}
.panel-head p{margin:4px 0 0;font-size:14px;color:var(--ink-2)}
.panel-body{overflow-y:auto;padding:14px 18px 22px;-webkit-overflow-scrolling:touch}
.closebtn{border:0;background:var(--surface-2);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);flex:none}
.closebtn svg{width:16px;height:16px}
.bigbtn{width:100%;border-radius:12px;padding:13px;font-size:16px;font-weight:650;border:1.5px dashed var(--sleeve);background:transparent;color:var(--ink)}
.bigbtn.on{border:4px solid var(--yellow);background:var(--face);padding:10.5px}
.bigbtn.primary{border:0;background:var(--blue);color:var(--on-blue)}
.bigbtn.danger{border:1px solid var(--line);color:var(--warn-text)}
.sec{margin-top:20px}
.sec h4{font-size:15px;margin:0 0 8px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
.sec h4 span{font-weight:500;font-size:13px;color:var(--ink-3)}
.setgrp{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.setgrp-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;width:100%;text-align:left;border:0;background:var(--surface-2);padding:10px 12px}
.setgrp-h b{font-size:15px;font-weight:650}
.setgrp-h span{font-size:13px;color:var(--ink-3);flex:none}
.cards{width:100%;border-collapse:collapse;font-size:14px}
.cards td{padding:7px 12px;border-top:1px solid var(--line);vertical-align:top}
.cards td:first-child{width:72px;color:var(--ink-2);white-space:nowrap}
.note{font-size:13.5px;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:10px 12px;margin:0}
.toggle-line{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-2);margin:4px 0 12px}
.toggle-line input{width:20px;height:20px;accent-color:var(--blue)}
.err{color:var(--warn-text);font-size:14px;margin:6px 0 0}
.ok{color:var(--blue-text);font-size:14px;margin:6px 0 0}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 10px 10px 16px;display:flex;gap:14px;align-items:center;font-size:14px;max-width:calc(100% - 32px)}
.toast[hidden]{display:none}
.toast button{border:0;background:transparent;color:var(--yellow);font-weight:700;padding:6px 8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (min-width:700px){
  .sheet{align-items:center}
  .panel{border-radius:18px;max-height:84vh}
  .binder{grid-template-columns:repeat(auto-fill,minmax(122px,1fr))}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="top-row">
      <h1>Mi colección Pokémon TCG</h1>
      <button class="iconbtn" id="backupBtn" type="button">Respaldo</button>
    </div>
    <div class="total"><b id="totNum">0</b><span id="totOf">de 1,025 especies</span></div>
    <div class="bar" role="progressbar" aria-label="Avance de especies" id="totBarWrap"><i id="totBar"></i></div>
    <div class="sub">
      <div>Formas regionales <strong id="subForm">0</strong></div>
      <div>Megas <strong id="subMega">0</strong></div>
    </div>
  </header>

  <main>
    <section id="v-coleccion" aria-labelledby="t-coleccion">
      <div class="sticky">
        <div class="chips" id="regChips" role="group" aria-label="Región"></div>
        <div class="tools">
          <input type="search" id="qCol" placeholder="Nombre o número" aria-label="Buscar en la región">
          <select id="fCol" aria-label="Mostrar">
            <option value="all">Todas</option>
            <option value="miss">Me faltan</option>
            <option value="have">Ya tengo</option>
          </select>
        </div>
      </div>
      <div class="region-line"><h2 id="regTitle"></h2><span id="regCount"></span></div>
      <div class="binder" id="grid" role="list"></div>
      <p class="hint">Toca una carta para marcarla. El botón de la esquina muestra en qué expansiones sale.</p>
    </section>

    <section id="v-faltan" aria-labelledby="t-faltan" hidden>
      <div class="sticky">
        <div class="chips" id="missChips" role="group" aria-label="Región"></div>
        <div class="tools">
          <input type="search" id="qMiss" placeholder="Nombre o número" aria-label="Buscar faltantes">
          <select id="fMiss" aria-label="Disponibilidad">
            <option value="all">Todas</option>
            <option value="en">Con carta en inglés</option>
            <option value="ja">Con carta en japonés</option>
            <option value="none">Aún sin carta</option>
          </select>
        </div>
      </div>
      <div class="region-line"><h2 id="missTitle">Me faltan</h2><span id="missCount"></span></div>
      <ul class="list" id="missList"></ul>
    </section>

    <section id="v-expansiones" aria-labelledby="t-expansiones" hidden>
      <div class="sticky">
        <div class="seg" role="group" aria-label="Idioma">
          <button type="button" data-lang="en" aria-pressed="true">Inglés</button>
          <button type="button" data-lang="ja" aria-pressed="false">Japonés</button>
        </div>
        <div class="tools">
          <input type="search" id="qSets" placeholder="Nombre o código" aria-label="Buscar expansión">
          <select id="sSets" aria-label="Ordenar">
            <option value="useful">Más útiles</option>
            <option value="recent">Más recientes</option>
          </select>
        </div>
      </div>
      <label class="toggle-line" style="margin-top:12px"><input type="checkbox" id="hidePromo" checked> Ocultar promocionales y colecciones especiales</label>
      <p class="hint" id="setsHint"></p>
      <ul class="list" id="setList"></ul>
      <button class="more" type="button" id="setsMore" hidden></button>
    </section>
  </main>
</div>

<nav class="tabs" aria-label="Secciones">
  <div class="wrap">
    <button type="button" data-view="coleccion" id="t-coleccion"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="7" height="8" rx="1.5"/><rect x="14" y="3" width="7" height="8" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5" stroke-dasharray="2.5 2"/></svg>Colección</button>
    <button type="button" data-view="faltan" id="t-faltan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2" stroke-dasharray="3 2.2"/><path d="M12 9v6M9 12h6"/></svg>Me faltan</button>
    <button type="button" data-view="expansiones" id="t-expansiones"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 8l8-4 8 4-8 4-8-4z"/><path d="M4 12l8 4 8-4"/><path d="M4 16l8 4 8-4"/></svg>Expansiones</button>
  </div>
</nav>

<div class="sheet" id="sheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1" id="panel">
    <div class="panel-head">
      <button class="closebtn" type="button" id="sheetBack" aria-label="Regresar" hidden><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg></button>
      <div class="titles"><h3 id="sheetTitle"></h3><p id="sheetSub"></p></div>
      <button class="closebtn" type="button" id="sheetClose" aria-label="Cerrar"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg></button>
    </div>
    <div class="panel-body" id="sheetBody"></div>
  </div>
</div>

<script>
(function(){
"use strict";
var DATA=JSON.parse(document.getElementById("data").textContent);
var KEY="tcg-coleccion-javi-v1", UIKEY="tcg-coleccion-javi-ui";
var NF=new Intl.NumberFormat("es-MX");
var MESES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
var REG=DATA.regions, REGNAME={};
REG.forEach(function(r){REGNAME[r[0]]=r[1];});
var LANG={en:DATA.en, ja:DATA.ja};
function apos(s){return String(s).replace(/'/g,"\u2019");}
var E=DATA.entries.map(function(r,i){
  var id=r[0];
  return {i:i,id:id,r:r[1],d:r[2],n:apos(r[3]),ja:r[4]||"",def:!!r[5],en:r[6],jp:r[7],
    kind:id.indexOf("base-")===0?"sp":(id.indexOf("mega-")===0?"mega":"forma")};
});
E.forEach(function(e){e.key=norm(e.n)+" "+e.ja+" "+pad(e.d)+" "+e.d;});
var byRegion={}; E.forEach(function(e){(byRegion[e.r]=byRegion[e.r]||[]).push(e);});

/* índice de cartas por expansión */
var setCards={en:{},ja:{}};
["en","ja"].forEach(function(l){
  E.forEach(function(e){
    (l==="en"?e.en:e.jp).forEach(function(p){
      var a=setCards[l][p[0]]||(setCards[l][p[0]]=[]); a.push([e.i,p[1],p[2]]);
    });
  });
});

/* estado */
var over={};
try{var st=JSON.parse(localStorage.getItem(KEY)||"{}"); if(st&&st.o) over=st.o;}catch(x){over={};}
var ui={view:"coleccion",region:"kanto",fCol:"all",missRegion:"all",fMiss:"all",lang:"en",sSets:"useful",hidePromo:true};
try{var u=JSON.parse(localStorage.getItem(UIKEY)||"{}"); for(var k in u){ if(k in ui) ui[k]=u[k]; }}catch(x){}
function saveUI(){try{localStorage.setItem(UIKEY,JSON.stringify(ui));}catch(x){}}
function has(e){return (e.id in over)?!!over[e.id]:e.def;}
function save(){try{localStorage.setItem(KEY,JSON.stringify({o:over,t:Date.now()}));}catch(x){}}
function setHas(e,v){ if(!!v===e.def) delete over[e.id]; else over[e.id]=v?1:0; save(); }

/* utilidades */
function norm(s){return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[\u2019']/g,"");}
function pad(n){n=String(n);return n.length>=3?n:("00"+n).slice(-3);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function fdate(d){if(!d)return "";var p=d.split("-");return (+p[2])+" "+MESES[+p[1]-1]+" "+p[0];}
function year(d){return d?d.slice(0,4):"";}
var NOW=Date.now();
function recent(d){if(!d)return false;var t=Date.parse(d+"T00:00:00");return (NOW-t)<548*864e5 && t<=NOW+30*864e5;}
function setInfo(l,si){var s=LANG[l].sets[si];return {id:s[0],name:apos(s[1]),date:s[2],serie:s[3],count:s[4]};}
function cardName(l,ni){return apos(LANG[l].names[ni]);}
function isPromo(l,si){var s=LANG[l].sets[si];return /promo|プロモ|black star/i.test(s[1])||/mcdonald/i.test(s[3])||/-P$/.test(s[0])||/^(swsh|xy|sm|sv|me|bw|dp|hgss|np|base|pop)p$/i.test(s[0]);}
function langPrints(e,l){return l==="en"?e.en:e.jp;}
function nSets(list){var s={};list.forEach(function(p){s[p[0]]=1;});return Object.keys(s).length;}
var CHECK='<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M4.5 10.5l3.5 3.5 7.5-8"/></svg>';
var PLUS='<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M10 5v10M5 10h10"/></svg>';
var INFO='<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10" cy="10" r="7.5"/><path d="M10 9v5"/><circle cx="10" cy="6.4" r=".6" fill="currentColor"/></svg>';
function $(id){return document.getElementById(id);}

/* totales */
function renderTotals(){
  var sp=0,spT=0,fo=0,foT=0,me=0,meT=0;
  E.forEach(function(e){var h=has(e);
    if(e.kind==="sp"){spT++; if(h)sp++;} else if(e.kind==="mega"){meT++; if(h)me++;} else {foT++; if(h)fo++;}});
  $("totNum").textContent=NF.format(sp);
  $("totOf").textContent="de "+NF.format(spT)+" especies, "+Math.round(sp/spT*100)+"%";
  $("totBar").style.width=(sp/spT*100).toFixed(1)+"%";
  $("totBarWrap").setAttribute("aria-valuenow",Math.round(sp/spT*100));
  $("subForm").textContent=fo+" de "+foT;
  $("subMega").textContent=me+" de "+meT;
}
function regionStats(r){var a=byRegion[r]||[],h=0;a.forEach(function(e){if(has(e))h++;});return {h:h,t:a.length};}

/* vista colección */
function renderRegChips(){
  $("regChips").innerHTML=REG.map(function(r){var s=regionStats(r[0]);
    return '<button type="button" class="chip" data-r="'+r[0]+'" aria-pressed="'+(ui.region===r[0])+'">'+esc(r[1])+'<small>'+s.h+'/'+s.t+'</small></button>';}).join("");
}
function renderGrid(){
  var q=norm($("qCol").value.trim()), f=ui.fCol, a=byRegion[ui.region]||[], s=regionStats(ui.region);
  $("regTitle").textContent=REGNAME[ui.region];
  $("regCount").textContent=s.h+" de "+s.t+", faltan "+(s.t-s.h);
  var html=[];
  a.forEach(function(e){
    var h=has(e);
    if(f==="miss"&&h)return; if(f==="have"&&!h)return;
    if(q&&e.key.indexOf(q)<0)return;
    html.push('<div class="tile'+(h?' has':'')+'" role="listitem" data-i="'+e.i+'"><button type="button" class="tbtn" data-t="'+e.i+'" aria-pressed="'+h+'" aria-label="'+esc(e.n)+(h?', la tengo':', me falta')+'"><span class="no">#'+pad(e.d)+'</span><span><span class="nm">'+esc(e.n)+'</span>'+(!h&&!e.en.length&&!e.jp.length?'<span class="nc">Aún sin carta</span>':'')+'</span></button><button type="button" class="info" data-info="'+e.i+'" aria-label="Expansiones de '+esc(e.n)+'">'+INFO+'</button></div>');
  });
  $("grid").innerHTML=html.length?html.join(""):'<p class="empty">Nada coincide con la búsqueda.</p>';
}

/* vista faltantes */
function avail(e){return e.en.length?"en":(e.jp.length?"ja":"none");}
function renderMissChips(){
  var cnt={all:0};E.forEach(function(e){if(!has(e)){cnt.all++;cnt[e.r]=(cnt[e.r]||0)+1;}});
  var h='<button type="button" class="chip" data-mr="all" aria-pressed="'+(ui.missRegion==="all")+'">Todas<small>'+cnt.all+'</small></button>';
  REG.forEach(function(r){if(!cnt[r[0]])return;h+='<button type="button" class="chip" data-mr="'+r[0]+'" aria-pressed="'+(ui.missRegion===r[0])+'">'+esc(r[1])+'<small>'+cnt[r[0]]+'</small></button>';});
  $("missChips").innerHTML=h;
}
function latest(l,list){if(!list.length)return null;for(var k=0;k<list.length;k++){if(!isPromo(l,list[k][0]))return setInfo(l,list[k][0]);}return setInfo(l,list[0][0]);}
function renderMiss(){
  var q=norm($("qMiss").value.trim()), f=ui.fMiss, out=[];
  if(ui.missRegion!=="all"&&!(byRegion[ui.missRegion]||[]).some(function(e){return !has(e);})) ui.missRegion="all";
  E.forEach(function(e){
    if(has(e))return;
    if(ui.missRegion!=="all"&&e.r!==ui.missRegion)return;
    if(f==="en"&&!e.en.length)return; if(f==="ja"&&!e.jp.length)return; if(f==="none"&&(e.en.length||e.jp.length))return;
    if(q&&e.key.indexOf(q)<0)return;
    out.push(e);
  });
  $("missTitle").textContent=ui.missRegion==="all"?"Me faltan":"Me faltan en "+REGNAME[ui.missRegion];
  $("missCount").textContent=out.length+(out.length===1?" carta":" cartas");
  $("missList").innerHTML=out.length?out.map(function(e){
    var meta;
    if(!e.en.length&&!e.jp.length){meta='<span class="tag none">Aún sin carta impresa</span>';}
    else{
      var parts=[];
      if(e.en.length){var le=latest("en",e.en);parts.push('Inglés: '+nSets(e.en)+' exp., la más reciente <em>'+esc(le.name)+'</em> ('+year(le.date)+')');}
      else parts.push('Sin carta en inglés');
      if(e.jp.length){var lj=latest("ja",e.jp);parts.push('Japonés: '+nSets(e.jp)+' exp., la más reciente <em>'+esc(lj.name)+'</em> ('+year(lj.date)+')');}
      meta=parts.join('<br>');
    }
    return '<li class="row"><button type="button" class="row-main" data-info="'+e.i+'"><div class="row-title">'+esc(e.n)+'<span class="no">#'+pad(e.d)+(ui.missRegion==="all"?', '+esc(REGNAME[e.r]):'')+'</span></div><div class="row-meta">'+meta+'</div></button><button type="button" class="mark" data-mark="'+e.i+'" aria-pressed="false" aria-label="Marcar '+esc(e.n)+' como obtenida">'+PLUS+'</button></li>';
  }).join(""):'<li class="empty">'+(E.some(function(e){return !has(e);})?'Nada coincide con el filtro.':'No te falta ninguna. Colección completa.')+'</li>';
}

/* vista expansiones */
var setsLimit=40;
function setStats(l){
  var res=[];
  Object.keys(setCards[l]).forEach(function(si){
    var seen={},miss=0;
    setCards[l][si].forEach(function(c){if(seen[c[0]])return;seen[c[0]]=1;if(!has(E[c[0]]))miss++;});
    res.push({si:+si,miss:miss,tot:Object.keys(seen).length,info:setInfo(l,+si)});
  });
  return res;
}
function renderSets(){
  document.querySelectorAll(".seg button").forEach(function(b){b.setAttribute("aria-pressed",b.getAttribute("data-lang")===ui.lang);});
  $("sSets").value=ui.sSets;
  var q=norm($("qSets").value.trim()), l=ui.lang;
  var all=setStats(l);
  var hp=ui.hidePromo;
  var base=hp?all.filter(function(s){return !isPromo(l,s.si);}):all;
  var list=base.filter(function(s){return s.miss>0;});
  if(q) list=base.filter(function(s){return norm(s.info.name+" "+s.info.id+" "+s.info.serie).indexOf(q)>=0;});
  if(ui.sSets==="useful") list.sort(function(a,b){return b.miss-a.miss||b.info.date.localeCompare(a.info.date);});
  else list.sort(function(a,b){return b.info.date.localeCompare(a.info.date)||b.miss-a.miss;});
  $("setsHint").textContent=(q?list.length+" expansiones coinciden.":list.length+" expansiones traen al menos una carta que te falta.")+(l==="ja"?" El catálogo japonés de la fuente está incompleto, sobre todo antes de 2016.":"");
  var shown=list.slice(0,setsLimit);
  $("setList").innerHTML=shown.length?shown.map(function(s){
    return '<li class="row"><button type="button" class="row-main" data-set="'+s.si+'"><div class="row-title">'+esc(s.info.name)+(recent(s.info.date)?' <span class="tag">Reciente</span>':'')+'</div><div class="row-meta">'+esc(s.info.id)+', '+fdate(s.info.date)+(s.info.serie?', '+esc(s.info.serie):'')+'</div></button><div class="count"><b>'+s.miss+'</b><span>'+(s.miss===1?'faltante':'faltantes')+'</span></div></li>';
  }).join(""):'<li class="empty">Ninguna expansión coincide.</li>';
  var mb=$("setsMore");
  if(list.length>setsLimit){mb.hidden=false;mb.textContent="Ver "+Math.min(40,list.length-setsLimit)+" más";} else mb.hidden=true;
}

/* hoja inferior */
var stack=[], lastFocus=null;
function openSheet(item,push){
  if(!push) stack=[];
  stack.push(item);
  if($("sheet").hidden){lastFocus=document.activeElement;}
  $("sheet").hidden=false; document.body.style.overflow="hidden";
  drawSheet();
  $("panel").focus();
}
function closeSheet(){
  $("sheet").hidden=true; stack=[]; document.body.style.overflow="";
  if(lastFocus&&lastFocus.focus&&document.body.contains(lastFocus)) lastFocus.focus();
}
function drawSheet(){
  var it=stack[stack.length-1];
  $("sheetBack").hidden=stack.length<2;
  if(it.t==="entry") drawEntry(E[it.i]);
  else if(it.t==="set") drawSet(it.l,it.si);
  else if(it.t==="backup") drawBackup();
  $("sheetBody").scrollTop=0;
}
function groupPrints(l,list){
  var groups=[],map={};
  list.forEach(function(p){var g=map[p[0]];if(!g){g=map[p[0]]={si:p[0],cards:[]};groups.push(g);}g.cards.push(p);});
  return groups;
}
function printsSection(e,l,title){
  var list=langPrints(e,l);
  var h='<div class="sec"><h4>'+title+'<span>'+(list.length?list.length+(list.length===1?' carta en ':' cartas en ')+nSets(list)+(nSets(list)===1?' expansión':' expansiones'):'')+'</span></h4>';
  if(!list.length){
    h+='<p class="note">'+(l==="en"?'No hay registro de una carta de este Pokémon en inglés.':'No hay registro de una carta de este Pokémon en japonés. La fuente no tiene completo el catálogo japonés, así que podría existir.')+'</p></div>';
    return h;
  }
  groupPrints(l,list).forEach(function(g){
    var s=setInfo(l,g.si);
    h+='<div class="setgrp"><button type="button" class="setgrp-h" data-gset="'+l+':'+g.si+'"><b>'+esc(s.name)+'</b><span>'+esc(s.id)+', '+year(s.date)+'</span></button><table class="cards"><tbody>'+
      g.cards.map(function(c){return '<tr><td>N.º '+esc(c[1])+'</td><td>'+esc(cardName(l,c[2]))+'</td></tr>';}).join("")+'</tbody></table></div>';
  });
  return h+'</div>';
}
function drawEntry(e){
  var h=has(e);
  $("sheetTitle").textContent=e.n;
  $("sheetSub").textContent="N.º "+pad(e.d)+", "+REGNAME[e.r]+(e.ja?", "+e.ja:"");
  var b='<button type="button" class="bigbtn'+(h?' on':'')+'" data-toggle="'+e.i+'" aria-pressed="'+h+'">'+(h?'La tengo. Toca para quitarla':'Marcar como obtenida')+'</button>';
  if(!e.en.length&&!e.jp.length) b+='<div class="sec"><p class="note">Todavía no hay una carta impresa de esta forma en inglés ni en japonés. Si sale en una expansión nueva, actualiza los datos de la app.</p></div>';
  else b+=printsSection(e,"en","En inglés")+printsSection(e,"ja","En japonés");
  $("sheetBody").innerHTML=b;
}
var setShowOwned=false;
function drawSet(l,si){
  var s=setInfo(l,si), rows=setCards[l][si]||[], by={}, order=[];
  rows.forEach(function(c){if(!by[c[0]]){by[c[0]]=[];order.push(c[0]);}by[c[0]].push(c);});
  order.sort(function(a,b){return a-b;});
  var miss=order.filter(function(i){return !has(E[i]);}).length;
  $("sheetTitle").textContent=s.name;
  $("sheetSub").textContent=s.id+", "+fdate(s.date)+(s.serie?", "+s.serie:"")+(l==="ja"?", japonés":", inglés");
  var shown=order.filter(function(i){return setShowOwned||!has(E[i]);});
  var h='<p class="note">Trae '+order.length+(order.length===1?' Pokémon de tu lista':' Pokémon de tu lista')+'. Te faltan <strong>'+miss+'</strong>.</p>'+
    '<label class="toggle-line"><input type="checkbox" id="showOwned"'+(setShowOwned?' checked':'')+'> Mostrar también las que ya tengo</label><ul class="list">';
  if(!shown.length) h+='<li class="empty">No te falta ninguna de esta expansión.</li>';
  shown.forEach(function(i){
    var e=E[i],hh=has(e);
    var nums=by[i].map(function(c){return 'N.º '+esc(c[1])+' '+esc(cardName(l,c[2]));}).join('<br>');
    h+='<li class="row"><button type="button" class="row-main" data-info="'+i+'"><div class="row-title">'+esc(e.n)+'<span class="no">#'+pad(e.d)+', '+esc(REGNAME[e.r])+'</span></div><div class="row-meta">'+nums+'</div></button><button type="button" class="mark" data-mark="'+i+'" aria-pressed="'+hh+'" aria-label="'+(hh?'Quitar ':'Marcar ')+esc(e.n)+'">'+(hh?CHECK:PLUS)+'</button></li>';
  });
  $("sheetBody").innerHTML=h+'</ul>';
}
function exportCode(){
  return JSON.stringify({app:"tcg-coleccion",v:1,fecha:new Date().toISOString().slice(0,10),tengo:E.filter(has).map(function(e){return e.id;})});
}
var resetArmed=false;
function drawBackup(){
  $("sheetTitle").textContent="Respaldo";
  $("sheetSub").textContent="Tu avance se guarda solo en este navegador";
  $("sheetBody").innerHTML=
    '<p class="note">Si borras los datos del navegador o cambias de teléfono, pierdes las marcas. Copia este código de vez en cuando y guárdalo en tus notas o en un correo.</p>'+
    '<div class="sec"><h4>Copiar respaldo</h4><textarea id="expTxt" readonly aria-label="Código de respaldo">'+esc(exportCode())+'</textarea><button type="button" class="bigbtn primary" id="copyBtn" style="margin-top:8px">Copiar código</button><p id="copyMsg" class="ok" hidden></p></div>'+
    '<div class="sec"><h4>Restaurar respaldo</h4><textarea id="impTxt" aria-label="Pega aquí un código de respaldo" placeholder="Pega aquí el código que copiaste"></textarea><button type="button" class="bigbtn" id="impBtn" style="margin-top:8px">Restaurar</button><p id="impMsg" class="err" hidden></p></div>'+
    '<div class="sec"><h4>Empezar de nuevo</h4><p class="note" style="margin-bottom:8px">Regresa todas las marcas a como estaban en tu hoja de Google el 29 oct 2026.</p><button type="button" class="bigbtn danger" id="resetBtn">Volver a los datos de la hoja</button></div>'+
    '<div class="sec"><h4>Sobre los datos</h4><p class="note">Las expansiones y números de carta vienen de TCGdex, descargados el 29 oct 2026. No incluye TCG Pocket. El catálogo japonés de la fuente está incompleto, sobre todo en expansiones anteriores a 2016.</p></div>';
  resetArmed=false;
}

/* render general */
function renderAll(){
  renderTotals();
  if(ui.view==="coleccion"){renderRegChips();renderGrid();}
  if(ui.view==="faltan"){renderMissChips();renderMiss();}
  if(ui.view==="expansiones"){renderSets();}
}
function showView(v,fromHash){
  if(["coleccion","faltan","expansiones"].indexOf(v)<0)v="coleccion";
  ui.view=v;saveUI();
  ["coleccion","faltan","expansiones"].forEach(function(x){
    $("v-"+x).hidden=(x!==v);
    $("t-"+x).setAttribute("aria-current",x===v?"page":"false");
  });
  if(!fromHash && location.hash!=="#"+v){try{history.replaceState(null,"","#"+v);}catch(x){location.hash=v;}}
  setsLimit=40;
  renderAll();
  window.scrollTo(0,0);
}

/* toast */
var toastTimer=null,undoFn=null;
function toast(msg,undo){
  $("toastMsg").textContent=msg; undoFn=undo||null; $("toastUndo").hidden=!undo;
  $("toast").hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(function(){$("toast").hidden=true;undoFn=null;},4200);
}
$("toastUndo").addEventListener("click",function(){if(undoFn){undoFn();undoFn=null;}$("toast").hidden=true;});

function toggleEntry(e,source){
  var prev=has(e); setHas(e,!prev);
  afterChange(e);
  toast(e.n+(prev?": quitada":": ¡obtenida!"),function(){setHas(e,prev);afterChange(e);});
}
function afterChange(e){
  renderTotals();
  if(ui.view==="coleccion"){
    renderRegChips();
    var f=ui.fCol, tile=document.querySelector('.tile[data-i="'+e.i+'"]');
    if(tile&&f==="all"){var h=has(e);tile.classList.toggle("has",h);var b=tile.querySelector(".tbtn");b.setAttribute("aria-pressed",h);b.setAttribute("aria-label",e.n+(h?", la tengo":", me falta"));
      tile.classList.remove("pop");void tile.offsetWidth;tile.classList.add("pop");
      var s=regionStats(ui.region);$("regCount").textContent=s.h+" de "+s.t+", faltan "+(s.t-s.h);}
    else renderGrid();
  }
  if(ui.view==="faltan"){renderMissChips();renderMiss();}
  if(ui.view==="expansiones"){renderSets();}
  if(!$("sheet").hidden) drawSheet();
}

/* eventos */
$("regChips").addEventListener("click",function(ev){var b=ev.target.closest("[data-r]");if(!b)return;ui.region=b.getAttribute("data-r");saveUI();$("qCol").value="";renderRegChips();renderGrid();b.scrollIntoView({inline:"center",block:"nearest"});});
$("qCol").addEventListener("input",renderGrid);
$("fCol").addEventListener("change",function(){ui.fCol=this.value;saveUI();renderGrid();});
$("grid").addEventListener("click",function(ev){
  var inf=ev.target.closest("[data-info]"); if(inf){openSheet({t:"entry",i:+inf.getAttribute("data-info")});return;}
  var t=ev.target.closest("[data-t]"); if(t){toggleEntry(E[+t.getAttribute("data-t")]);}
});
$("missChips").addEventListener("click",function(ev){var b=ev.target.closest("[data-mr]");if(!b)return;ui.missRegion=b.getAttribute("data-mr");saveUI();renderMissChips();renderMiss();});
$("qMiss").addEventListener("input",renderMiss);
$("fMiss").addEventListener("change",function(){ui.fMiss=this.value;saveUI();renderMiss();});
function listClick(ev){
  var m=ev.target.closest("[data-mark]"); if(m){toggleEntry(E[+m.getAttribute("data-mark")]);return;}
  var inf=ev.target.closest("[data-info]"); if(inf){openSheet({t:"entry",i:+inf.getAttribute("data-info")},!$("sheet").hidden);return;}
  var st=ev.target.closest("[data-set]"); if(st){setShowOwned=false;openSheet({t:"set",l:ui.lang,si:+st.getAttribute("data-set")});}
}
$("missList").addEventListener("click",listClick);
$("setList").addEventListener("click",listClick);
document.querySelector(".seg").addEventListener("click",function(ev){var b=ev.target.closest("[data-lang]");if(!b)return;ui.lang=b.getAttribute("data-lang");saveUI();setsLimit=40;renderSets();});
$("qSets").addEventListener("input",function(){setsLimit=40;renderSets();});
$("sSets").addEventListener("change",function(){ui.sSets=this.value;saveUI();setsLimit=40;renderSets();});
$("hidePromo").addEventListener("change",function(){ui.hidePromo=this.checked;saveUI();setsLimit=40;renderSets();});
$("setsMore").addEventListener("click",function(){setsLimit+=40;renderSets();});
document.querySelector(".tabs").addEventListener("click",function(ev){var b=ev.target.closest("[data-view]");if(b)showView(b.getAttribute("data-view"));});
window.addEventListener("hashchange",function(){showView(location.hash.slice(1),true);});
$("backupBtn").addEventListener("click",function(){openSheet({t:"backup"});});
$("sheetClose").addEventListener("click",closeSheet);
$("sheetBack").addEventListener("click",function(){if(stack.length>1){stack.pop();drawSheet();}});
$("sheet").addEventListener("click",function(ev){if(ev.target===this)closeSheet();});
document.addEventListener("keydown",function(ev){if(ev.key==="Escape"&&!$("sheet").hidden)closeSheet();});
$("sheetBody").addEventListener("click",function(ev){
  var tg=ev.target.closest("[data-toggle]"); if(tg){toggleEntry(E[+tg.getAttribute("data-toggle")]);return;}
  var gs=ev.target.closest("[data-gset]"); if(gs){var p=gs.getAttribute("data-gset").split(":");setShowOwned=false;openSheet({t:"set",l:p[0],si:+p[1]},true);return;}
  var m=ev.target.closest("[data-mark]"); if(m){toggleEntry(E[+m.getAttribute("data-mark")]);return;}
  var inf=ev.target.closest("[data-info]"); if(inf){openSheet({t:"entry",i:+inf.getAttribute("data-info")},true);return;}
  if(ev.target.id==="copyBtn"){
    var ta=$("expTxt"),msg=$("copyMsg");
    var done=function(){msg.hidden=false;msg.textContent="Código copiado.";};
    var fallback=function(){ta.focus();ta.select();var ok=false;try{ok=document.execCommand("copy");}catch(x){}
      msg.hidden=false;msg.textContent=ok?"Código copiado.":"Tu navegador no permitió copiar. Mantén presionado el texto y elige Copiar.";};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(done,fallback);}else fallback();
    return;
  }
  if(ev.target.id==="impBtn"){
    var raw=$("impTxt").value.trim(), em=$("impMsg");
    em.hidden=true;
    if(!raw){em.hidden=false;em.className="err";em.textContent="Pega primero el código de respaldo.";return;}
    var d;try{d=JSON.parse(raw);}catch(x){d=null;}
    if(!d||d.app!=="tcg-coleccion"||!Array.isArray(d.tengo)){em.hidden=false;em.className="err";em.textContent="Ese texto no es un código de respaldo de esta app. Revisa que lo copiaste completo.";return;}
    var setIds={};d.tengo.forEach(function(x){setIds[x]=1;});
    over={};E.forEach(function(e){var v=!!setIds[e.id];if(v!==e.def)over[e.id]=v?1:0;});save();
    renderAll();em.hidden=false;em.className="ok";em.textContent="Respaldo restaurado: "+d.tengo.length+" cartas marcadas.";
    $("expTxt").value=exportCode();
    return;
  }
  if(ev.target.id==="resetBtn"){
    if(!resetArmed){resetArmed=true;ev.target.textContent="Toca otra vez para confirmar";return;}
    over={};save();renderAll();drawBackup();toast("Marcas restablecidas a los datos de la hoja");
  }
});
$("sheetBody").addEventListener("change",function(ev){if(ev.target.id==="showOwned"){setShowOwned=ev.target.checked;drawSheet();}});
$("impTxt"); /* noop */

/* inicio */
document.querySelectorAll(".seg button");
$("fCol").value=ui.fCol; $("fMiss").value=ui.fMiss; $("hidePromo").checked=!!ui.hidePromo;
var h0=location.hash.slice(1);
showView(["coleccion","faltan","expansiones"].indexOf(h0)>=0?h0:ui.view,true);

if("serviceWorker" in navigator && /github\.io$|^localhost$|^127\.0\.0\.1$/.test(location.hostname)){
  window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});
}
})();
</script>
</body>
</html>
